<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workspace Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>
  <main class="scene">
    <div class="overlay"></div>

    <section class="card" aria-label="Login form">
      <div class="brand">
        <img src="./images/download.png" alt="TechStore Logo" class="logo-image" />
      </div>

      <h1>Login Here</h1>

      <form id="loginForm" class="login-form" novalidate>
        <label class="field" for="email">
          <span class="field-icon">@</span>
          <input id="email" name="email" type="email" placeholder="Username / Email" required />
        </label>

        <label class="field" for="password">
          <span class="field-icon">*</span>
          <input id="password" name="password" type="password" placeholder="Password" required />
        </label>

        <div class="row">
          <a href="#" class="muted-link">Forgot password?</a>
        </div>

        <button id="submitBtn" type="submit" class="submit-btn">Sign In</button>
      </form>

      <p id="status" class="status" aria-live="polite"></p>

      <div class="google-separator"
        style="display: flex; align-items: center; justify-content: center; gap: 10px; margin: 15px 0;">
        <span style="flex: 1; border-top: 1.5px solid rgba(148, 163, 184, 0.35);"></span>
        <span style="font-size: 0.85rem; color: #64748b; text-transform: uppercase; font-weight: 600;">or</span>
        <span style="flex: 1; border-top: 1.5px solid rgba(148, 163, 184, 0.35);"></span>
      </div>

      <div id="googleSignInButton" style="display: flex; justify-content: center; width: 100%;"></div>

      <p class="signup-text" style="margin-top: 15px;">Don't have an account? <a href="signup.html">Sign up</a></p>
    </section>
  </main>

  <script src="./login.js"></script>
</body>

</html>
